name: OSD canonical saved-trace replay

on:
  push:
    branches:
      - osd-nonblocking-corrected-20260731
    paths:
      - 'experiments/rtl/corrected/canonical_reference/**'
      - 'experiments/rtl/corrected/cap_nb_part_*.svh'
      - 'experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv'
      - '.github/workflows/osd-canonical-replay.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'experiments/rtl/corrected/canonical_reference/**'
      - 'experiments/rtl/corrected/cap_nb_part_*.svh'
      - 'experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv'
      - '.github/workflows/osd-canonical-replay.yml'
  workflow_dispatch:

jobs:
  export-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical C++ exporter
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -pedantic \
            -I experiments/rtl/corrected/canonical_reference \
            experiments/rtl/corrected/canonical_reference/export_canonical_trace.cc \
            -o /tmp/export_canonical_trace
      - name: Export frozen 1,000-frame canonical trace
        run: |
          mkdir -p experiments/results/canonical_trace
          /tmp/export_canonical_trace \
            --frames 1000 \
            --seed 5928218492399464753 \
            --output experiments/results/canonical_trace/canonical_cap_trace.bin \
            --manifest experiments/results/canonical_trace/canonical_cap_trace_manifest.json \
            | tee experiments/results/canonical_trace/export.log
          grep -q 'CANONICAL_TRACE_PASS frames=1000 seed=5928218492399464753 stream_checksum=11508365490867720138' \
            experiments/results/canonical_trace/export.log
          sha256sum experiments/results/canonical_trace/canonical_cap_trace.bin \
            | tee experiments/results/canonical_trace/canonical_cap_trace.sha256
      - name: Upload canonical trace
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cap-trace-${{ github.run_id }}
          path: experiments/results/canonical_trace/
          if-no-files-found: error

  build-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make
      - name: Apply Verilator-compatible reset spelling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('experiments/rtl/corrected/cap_nb_part_03.svh')
          text = path.read_text()
          old = 'for (k=0;k<=K;k=k+1) info_prefix[k]<=0;'
          new = 'for (k=0;k<=K;k=k+1) info_prefix[k]=0;'
          if text.count(old) != 1:
              raise SystemExit('expected one info_prefix reset loop')
          path.write_text(text.replace(old, new))
          PY
      - name: Build deterministic canonical replay simulator
        run: |
          verilator --cc --exe --build -j 2 -O3 -Wno-fatal \
            --top-module cap_canonical_replay_pair_top \
            -Iexperiments/rtl/corrected \
            -Iexperiments/rtl/corrected/canonical_reference \
            experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv \
            experiments/rtl/corrected/canonical_reference/cap_canonical_replay_pair_top.sv \
            "$GITHUB_WORKSPACE/experiments/rtl/corrected/canonical_reference/cap_canonical_replay_verilator.cc" \
            --Mdir /tmp/canonical_replay_obj \
            -CFLAGS "-O3 -std=c++17"
          mkdir -p experiments/results/canonical_replay_bin
          cp /tmp/canonical_replay_obj/Vcap_canonical_replay_pair_top \
            experiments/results/canonical_replay_bin/
      - name: Upload replay simulator
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cap-replay-bin-${{ github.run_id }}
          path: experiments/results/canonical_replay_bin/Vcap_canonical_replay_pair_top
          if-no-files-found: error

  replay-50:
    needs: [export-trace, build-replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canonical-cap-trace-${{ github.run_id }}
          path: /tmp/canonical_trace
      - uses: actions/download-artifact@v4
        with:
          name: canonical-cap-replay-bin-${{ github.run_id }}
          path: /tmp/canonical_bin
      - name: Run 50-frame canonical correctness gate
        run: |
          BIN=$(find /tmp/canonical_bin -type f -name Vcap_canonical_replay_pair_top -print -quit)
          TRACE=$(find /tmp/canonical_trace -type f -name canonical_cap_trace.bin -print -quit)
          chmod +x "$BIN"
          mkdir -p replay_50
          "$BIN" --trace "$TRACE" --start 0 --count 50 \
            --csv replay_50/canonical_0_50.csv \
            | tee replay_50/canonical_0_50.log
          grep -q 'CANONICAL_REPLAY_PASS start=0 count=50 errors=0' replay_50/canonical_0_50.log
      - name: Upload 50-frame replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cap-replay-50-${{ github.run_id }}
          path: replay_50/
          if-no-files-found: warn

  replay-1000:
    needs: replay-50
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        start: [0, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canonical-cap-trace-${{ github.run_id }}
          path: /tmp/canonical_trace
      - uses: actions/download-artifact@v4
        with:
          name: canonical-cap-replay-bin-${{ github.run_id }}
          path: /tmp/canonical_bin
      - name: Replay canonical 50-frame shard
        run: |
          BIN=$(find /tmp/canonical_bin -type f -name Vcap_canonical_replay_pair_top -print -quit)
          TRACE=$(find /tmp/canonical_trace -type f -name canonical_cap_trace.bin -print -quit)
          chmod +x "$BIN"
          mkdir -p replay_shard
          "$BIN" --trace "$TRACE" --start ${{ matrix.start }} --count 50 \
            --csv replay_shard/canonical_${{ matrix.start }}.csv \
            | tee replay_shard/canonical_${{ matrix.start }}.log
          grep -q 'CANONICAL_REPLAY_PASS start=${{ matrix.start }} count=50 errors=0' \
            replay_shard/canonical_${{ matrix.start }}.log
      - name: Upload canonical shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cap-replay-shard-${{ matrix.start }}-${{ github.run_id }}
          path: replay_shard/
          if-no-files-found: warn

  aggregate-1000:
    needs: replay-1000
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: canonical-cap-replay-shard-*-${{ github.run_id }}
          path: /tmp/canonical_replay_all
          merge-multiple: true
      - name: Aggregate distributions and apply decision gate
        run: |
          mkdir -p canonical_replay_aggregate
          python3 experiments/rtl/corrected/canonical_reference/analyze_canonical_replay.py \
            --glob '/tmp/canonical_replay_all/canonical_*.csv' \
            --out canonical_replay_aggregate \
            | tee canonical_replay_aggregate/aggregate.log
          grep -q '^CANONICAL_REPLAY_AGGREGATE_PASS$' canonical_replay_aggregate/aggregate.log
      - name: Upload per-frame and aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cap-replay-aggregate-${{ github.run_id }}
          path: canonical_replay_aggregate/
          if-no-files-found: error
