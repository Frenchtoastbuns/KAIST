name: OSD compiled CAP synthesis

on:
  push:
    branches:
      - osd-compiled-cap-synth-20260731
  workflow_dispatch:

jobs:
  synth-xilinx7:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog
      - name: SystemVerilog syntax check
        run: |
          iverilog -g2012 -s cap_streamed_normal_top -o /tmp/normal.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv
          iverilog -g2012 -s cap_compiled_s45_top -o /tmp/s45.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv
          iverilog -g2012 -s cap_compiled_s48_top -o /tmp/s48.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv
          iverilog -g2012 -s cap_full_normal_top -o /tmp/full_normal.vvp experiments/rtl/cap_full_compiled_decoder.sv
          iverilog -g2012 -s cap_full_s45_top -o /tmp/full_s45.vvp experiments/rtl/cap_full_compiled_decoder.sv
          iverilog -g2012 -s cap_full_s48_top -o /tmp/full_s48.vvp experiments/rtl/cap_full_compiled_decoder.sv
      - name: Query-only Xilinx-7 synthesis
        run: bash experiments/rtl/synth_compiled_cap.sh
      - name: Full Xilinx-7 synthesis
        run: bash experiments/rtl/synth_full_compiled_cap.sh
      - name: Upload query-only reports
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cap-xilinx7-synthesis
          path: experiments/results/compiled_cap_synthesis
      - name: Upload full reports
        uses: actions/upload-artifact@v4
        with:
          name: full-compiled-cap-xilinx7-synthesis
          path: experiments/results/full_compiled_cap_synthesis
