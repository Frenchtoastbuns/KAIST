name: OSD compiled CAP synthesis

on:
  push:
    branches:
      - osd-compiled-cap-synth-20260731
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  synth-xilinx7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog

      - name: SystemVerilog syntax check
        run: |
          iverilog -g2012 -s cap_streamed_normal_top -o /tmp/normal.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv
          iverilog -g2012 -s cap_compiled_s45_top -o /tmp/s45.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv
          iverilog -g2012 -s cap_compiled_s48_top -o /tmp/s48.vvp experiments/rtl/cap_threshold_compiled_query_engine.sv

      - name: Xilinx-7 synthesis
        run: bash experiments/rtl/synth_compiled_cap.sh

      - name: Upload synthesis reports
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cap-xilinx7-synthesis
          path: experiments/results/compiled_cap_synthesis
