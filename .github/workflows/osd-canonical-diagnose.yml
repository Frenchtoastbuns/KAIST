name: OSD canonical frame 400 diagnosis

on:
  push:
    branches:
      - osd-nonblocking-corrected-20260731
    paths:
      - 'experiments/rtl/corrected/canonical_reference/**'
      - 'experiments/rtl/corrected/cap_nb_part_*.svh'
      - 'experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv'
      - '.github/workflows/osd-canonical-diagnose.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'experiments/rtl/corrected/canonical_reference/**'
      - 'experiments/rtl/corrected/cap_nb_part_*.svh'
      - 'experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv'
      - '.github/workflows/osd-canonical-diagnose.yml'
  workflow_dispatch:

jobs:
  verify-frame-400:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make
      - name: Build frozen trace exporter
        run: |
          g++ -std=c++17 -O3 \
            -I experiments/rtl/corrected/canonical_reference \
            experiments/rtl/corrected/canonical_reference/export_canonical_trace.cc \
            -o /tmp/export_canonical_trace
          /tmp/export_canonical_trace --frames 1000 --seed 5928218492399464753 \
            --output /tmp/canonical_cap_trace.bin \
            --manifest /tmp/canonical_cap_trace_manifest.json \
            | tee /tmp/export.log
          grep -q 'stream_checksum=11508365490867720138' /tmp/export.log
      - name: Apply Verilator-compatible reset spelling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('experiments/rtl/corrected/cap_nb_part_03.svh')
          text = path.read_text()
          old = 'for (k=0;k<=K;k=k+1) info_prefix[k]<=0;'
          new = 'for (k=0;k<=K;k=k+1) info_prefix[k]=0;'
          if text.count(old) != 1:
              raise SystemExit('expected one info_prefix reset loop')
          path.write_text(text.replace(old, new))
          PY
      - name: Build diagnostic replay simulator
        run: |
          verilator --cc --exe --build -j 2 -O3 -Wno-fatal \
            --top-module cap_canonical_replay_pair_top \
            -Iexperiments/rtl/corrected \
            -Iexperiments/rtl/corrected/canonical_reference \
            experiments/rtl/corrected/cap_nonblocking_corrected_decoder.sv \
            experiments/rtl/corrected/canonical_reference/cap_canonical_replay_pair_top.sv \
            "$GITHUB_WORKSPACE/experiments/rtl/corrected/canonical_reference/cap_canonical_replay_verilator.cc" \
            --Mdir /tmp/canonical_diag_obj \
            -CFLAGS "-O3 -std=c++17"
      - name: Verify frame 400 correction
        run: |
          mkdir -p diagnostic
          /tmp/canonical_diag_obj/Vcap_canonical_replay_pair_top \
            --trace /tmp/canonical_cap_trace.bin --start 400 --count 1 --diagnose \
            --csv diagnostic/frame400.csv 2>&1 | tee diagnostic/frame400.log
          grep -q '^CANONICAL_REPLAY_PASS start=400 count=1 errors=0' diagnostic/frame400.log
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-frame400-diagnostic-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: error
